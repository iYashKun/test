<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Style Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080b16;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

.header {
    height: 64px;
    background: #111525;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #242a40;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #ff3b6b;
}

.balance {
    background: #1b2032;
    padding: 10px 18px;
    border-radius: 20px;
    color: #62e6a5;
    font-weight: bold;
}

.game {
    width: min(1100px, 95%);
    margin: 25px auto;
}

.flight-box {
    position: relative;
    height: 500px;
    background:
        radial-gradient(circle at 50% 30%, #222d55 0%, transparent 35%),
        linear-gradient(145deg, #11182d, #090c18);
    border: 1px solid #29314b;
    border-radius: 18px;
    overflow: hidden;
}

.grid {
    position: absolute;
    inset: 0;
    opacity: .25;
    background-image:
        linear-gradient(#526080 1px, transparent 1px),
        linear-gradient(90deg, #526080 1px, transparent 1px);
    background-size: 55px 55px;
    transform: perspective(500px) rotateX(55deg) scale(1.6);
    transform-origin: bottom;
}

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: .6;
}

.multiplier {
    position: absolute;
    width: 100%;
    top: 40%;
    text-align: center;
    font-size: clamp(55px, 10vw, 105px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 25px #ff2864;
    z-index: 5;
}

.status {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 20px;
    background: rgba(0,0,0,.4);
    color: #aaa;
    z-index: 10;
}

.plane {
    position: absolute;
    left: 12%;
    bottom: 15%;
    font-size: 60px;
    transform: rotate(-20deg);
    z-index: 6;
    filter: drop-shadow(0 0 12px #ff3468);
    transition: none;
}

.flight-line {
    position: absolute;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ff2f68);
    transform-origin: left center;
    left: 10%;
    bottom: 16%;
    width: 0;
    opacity: .8;
}

.controls {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.panel {
    background: #111525;
    border: 1px solid #29314b;
    border-radius: 15px;
    padding: 18px;
}

.panel h3 {
    margin-bottom: 15px;
    color: #cbd1e5;
}

.bet-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    background: #090c17;
    border: 1px solid #333b57;
    color: white;
    padding: 14px;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff376c;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.bet-btn {
    background: #ff3268;
    color: white;
}

.bet-btn:hover {
    background: #ff1d59;
}

.cashout-btn {
    width: 100%;
    margin-top: 12px;
    background: #21d88c;
    color: #07150f;
    font-size: 17px;
}

.cashout-btn:disabled {
    background: #30374a;
    color: #777e91;
    cursor: not-allowed;
    transform: none;
}

.quick-bets {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.quick-bets button {
    background: #252b40;
    color: #aaa;
    padding: 7px 12px;
}

.info {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    color: #9da5bc;
    font-size: 14px;
}

.history {
    margin-top: 18px;
    background: #111525;
    border: 1px solid #29314b;
    border-radius: 15px;
    padding: 18px;
}

.history h3 {
    margin-bottom: 12px;
}

.history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.history-item {
    background: #20263a;
    color: #62e6a5;
    padding: 7px 12px;
    border-radius: 15px;
    font-size: 13px;
}

.history-item.low {
    color: #ff667f;
}

.message {
    text-align: center;
    min-height: 25px;
    margin-top: 15px;
    color: #aaa;
}

@media (max-width: 700px) {
    .controls {
        grid-template-columns: 1fr;
    }

    .flight-box {
        height: 400px;
    }

    .plane {
        font-size: 45px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">✈ AVIATOR</div>
    <div class="balance">
        Credits: <span id="balance">1000.00</span>
    </div>
</header>

<main class="game">

    <section class="flight-box" id="flightBox">
        <div class="stars" id="stars"></div>
        <div class="grid"></div>

        <div class="status" id="status">
            Waiting for next flight...
        </div>

        <div class="multiplier" id="multiplier">
            1.00x
        </div>

        <div class="flight-line" id="flightLine"></div>

        <div class="plane" id="plane">
            ✈
        </div>
    </section>

    <section class="controls">

        <div class="panel">
            <h3>Place Bet</h3>

            <div class="bet-row">
                <input
                    id="betAmount"
                    type="number"
                    min="1"
                    step="1"
                    value="10"
                    placeholder="Credits"
                >

                <button class="bet-btn" id="betBtn">
                    BET
                </button>
            </div>

            <div class="quick-bets">
                <button onclick="setBet(10)">10</button>
                <button onclick="setBet(25)">25</button>
                <button onclick="setBet(50)">50</button>
                <button onclick="setBet(100)">100</button>
            </div>

            <div class="info">
                <span>Your bet</span>
                <strong id="currentBet">0.00</strong>
            </div>

            <button
                class="cashout-btn"
                id="cashoutBtn"
                disabled
            >
                CASH OUT
            </button>
        </div>

        <div class="panel">
            <h3>Flight Information</h3>

            <div class="info">
                <span>Current multiplier</span>
                <strong id="infoMultiplier">1.00x</strong>
            </div>

            <div class="info">
                <span>Potential payout</span>
                <strong id="potential">0.00</strong>
            </div>

            <div class="info">
                <span>Game status</span>
                <strong id="gameStatus">Waiting</strong>
            </div>

            <div class="message" id="message">
                Place a virtual bet to join the next flight.
            </div>
        </div>

    </section>

    <section class="history">
        <h3>Recent Flights</h3>
        <div class="history-list" id="history"></div>
    </section>

</main>

<script>
let balance = 1000;
let multiplier = 1;
let crashPoint = 0;
let gameRunning = false;
let hasBet = false;
let currentBet = 0;
let animationStart = 0;
let animationFrame;

const balanceEl = document.getElementById("balance");
const multiplierEl = document.getElementById("multiplier");
const infoMultiplierEl = document.getElementById("infoMultiplier");
const potentialEl = document.getElementById("potential");
const currentBetEl = document.getElementById("currentBet");
const statusEl = document.getElementById("status");
const gameStatusEl = document.getElementById("gameStatus");
const messageEl = document.getElementById("message");
const betAmountEl = document.getElementById("betAmount");
const betBtn = document.getElementById("betBtn");
const cashoutBtn = document.getElementById("cashoutBtn");
const plane = document.getElementById("plane");
const flightLine = document.getElementById("flightLine");
const flightBox = document.getElementById("flightBox");
const historyEl = document.getElementById("history");

// Create background stars
for (let i = 0; i < 70; i++) {
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.opacity = Math.random();

    document.getElementById("stars").appendChild(star);
}

function updateBalance() {
    balanceEl.textContent = balance.toFixed(2);
}

function setBet(amount) {
    betAmountEl.value = amount;
}

function randomCrashPoint() {
    // Demo-only random crash value.
    // No real-money gambling is involved.
    const value = Math.pow(Math.random(), 1.7) * 8 + 1.05;
    return Math.min(value, 12);
}

function startFlight() {
    gameRunning = true;
    multiplier = 1;
    crashPoint = randomCrashPoint();
    animationStart = performance.now();

    statusEl.textContent = "FLIGHT IN PROGRESS";
    statusEl.style.color = "#62e6a5";
    gameStatusEl.textContent = "Flying";

    betBtn.disabled = true;
    betAmountEl.disabled = true;

    requestAnimationFrame(updateFlight);
}

function updateFlight(now) {
    if (!gameRunning) return;

    const elapsed = (now - animationStart) / 1000;

    // Exponential-looking multiplier growth
    multiplier = Math.pow(1.13, elapsed * 3);

    if (multiplier >= crashPoint) {
        multiplier = crashPoint;
        updateDisplay();
        crashFlight();
        return;
    }

    updateDisplay();
    movePlane(elapsed);

    animationFrame = requestAnimationFrame(updateFlight);
}

function updateDisplay() {
    const value = multiplier.toFixed(2) + "x";

    multiplierEl.textContent = value;
    infoMultiplierEl.textContent = value;

    if (hasBet) {
        potentialEl.textContent =
            (currentBet * multiplier).toFixed(2);
    } else {
        potentialEl.textContent = "0.00";
    }
}

function movePlane(elapsed) {
    const progress = Math.min(elapsed / 8, 1);

    const x = 10 + progress * 72;
    const y = 15 + progress * 65;

    plane.style.left = x + "%";
    plane.style.bottom = y + "%";

    plane.style.transform =
        "rotate(-20deg) scale(" +
        (1 + progress * .25) +
        ")";

    flightLine.style.width =
        (progress * 75) + "%";

    flightLine.style.transform =
        "rotate(-25deg)";
}

function placeBet() {
    if (gameRunning) {
        messageEl.textContent =
            "Wait for the next flight.";
        return;
    }

    const amount = Number(betAmountEl.value);

    if (!amount || amount <= 0) {
        messageEl.textContent =
            "Enter a valid bet amount.";
        return;
    }

    if (amount > balance) {
        messageEl.textContent =
            "Not enough virtual credits.";
        return;
    }

    balance -= amount;
    currentBet = amount;
    hasBet = true;

    currentBetEl.textContent =
        currentBet.toFixed(2);

    updateBalance();

    cashoutBtn.disabled = false;

    messageEl.textContent =
        "Bet placed. Cash out before the flight crashes.";

    startFlight();
}

function cashOut() {
    if (!gameRunning || !hasBet) return;

    const payout = currentBet * multiplier;

    balance += payout;

    updateBalance();

    messageEl.textContent =
        "Cashed out at " +
        multiplier.toFixed(2) +
        "x — won " +
        payout.toFixed(2) +
        " credits.";

    hasBet = false;
    currentBet = 0;

    currentBetEl.textContent = "0.00";
    potentialEl.textContent = "0.00";
    cashoutBtn.disabled = true;
}

function crashFlight() {
    gameRunning = false;

    cancelAnimationFrame(animationFrame);

    statusEl.textContent =
        "CRASHED AT " +
        crashPoint.toFixed(2) +
        "x";

    statusEl.style.color = "#ff536f";

    gameStatusEl.textContent = "Crashed";

    multiplierEl.style.color = "#ff4168";

    addHistory(crashPoint);

    if (hasBet) {
        messageEl.textContent =
            "Flight crashed. Your virtual bet was lost.";
    }

    hasBet = false;
    currentBet = 0;

    currentBetEl.textContent = "0.00";
    potentialEl.textContent = "0.00";
    cashoutBtn.disabled = true;

    setTimeout(resetFlight, 2500);
}

function resetFlight() {
    multiplier = 1;

    multiplierEl.textContent = "1.00x";
    multiplierEl.style.color = "#fff";

    infoMultiplierEl.textContent = "1.00x";

    plane.style.left = "12%";
    plane.style.bottom = "15%";
    plane.style.transform = "rotate(-20deg)";

    flightLine.style.width = "0";

    statusEl.textContent =
        "Waiting for next flight...";

    statusEl.style.color = "#aaa";

    gameStatusEl.textContent = "Waiting";

    betBtn.disabled = false;
    betAmountEl.disabled = false;

    messageEl.textContent =
        "Place a virtual bet to join the next flight.";
}

function addHistory(value) {
    const item = document.createElement("div");

    item.className =
        "history-item" +
        (value < 2 ? " low" : "");

    item.textContent =
        value.toFixed(2) + "x";

    historyEl.prepend(item);

    while (historyEl.children.length > 10) {
        historyEl.removeChild(
            historyEl.lastChild
        );
    }
}

betBtn.addEventListener("click", placeBet);
cashoutBtn.addEventListener("click", cashOut);

// Enter key places a bet
betAmountEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        placeBet();
    }
});

updateBalance();
</script>

</body>
</html>
