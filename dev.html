<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Restricted</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

      background:
        radial-gradient(circle at 20% 20%, rgba(32, 129, 226, .08), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, .08), transparent 35%),
        #f5f7fb;

      color: #172033;
    }

    main {
      width: min(100%, 540px);
      padding: 42px 38px;
      text-align: center;

      background: rgba(255, 255, 255, .92);
      border: 1px solid #e2e8f0;
      border-radius: 24px;

      box-shadow:
        0 25px 70px rgba(23, 32, 51, .10),
        0 4px 12px rgba(23, 32, 51, .04);

      backdrop-filter: blur(12px);

      animation: cardIn .45s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #eff6ff;
      border: 8px solid #eaf2ff;

      color: #2081e2;

      font-size: 30px;
      font-weight: 900;

      box-shadow: 0 10px 25px rgba(32, 129, 226, .12);
    }

    h1 {
      margin: 0;

      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -.5px;
    }

    p {
      max-width: 430px;
      margin: 14px auto 0;

      color: #64748b;
      line-height: 1.65;
      font-size: 15px;
    }

    .status {
      margin-top: 26px;
      padding: 13px 15px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      border: 1px solid #e5eaf2;
      border-radius: 12px;

      background: #f8fafc;
      color: #475569;

      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;

      box-shadow: 0 0 0 4px rgba(239, 68, 68, .10);
    }

    .actions {
      margin-top: 22px;
    }

    .reload-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;

      padding: 13px 18px;

      background: #2081e2;
      color: white;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(32, 129, 226, .22);

      transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
    }

    .reload-btn:hover {
      background: #176fc5;
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(32, 129, 226, .28);
    }

    .reload-btn:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
    }

    .footer {
      margin-top: 28px;
      padding-top: 18px;

      border-top: 1px solid #edf1f5;

      color: #94a3b8;
      font-size: 11px;
      letter-spacing: .2px;
    }

    @media (max-width: 480px) {
      main {
        padding: 34px 24px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">!</div>
    <h1>Access Restricted</h1>
    <p>
      Developer tools were detected on this page.
      Please close Inspect or DevTools and reload the page to continue.
    </p>
    <div class="status">
      <span class="dot"></span>
      Protected page
    </div>
    <div class="actions">
      <button class="reload-btn" onclick="location.reload()">
        ↻ &nbsp; Reload Page
      </button>
    </div>
    <div class="hint">
      Close Developer Tools before continuing.
    </div>
    <div class="footer">
      Security protection enabled
    </div>
  </main>
</body>
</html>
