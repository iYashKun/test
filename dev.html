<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <title>Access Restricted</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;

      --bg: #f6f8fb;
      --card: #ffffff;

      --text: #111827;
      --muted: #687386;
      --muted-light: #98a2b3;

      --border: #e5e9ef;
      --border-dark: #d9dee7;

      --blue: #2563eb;
      --blue-hover: #1d4ed8;

      --red: #dc3545;
      --red-bg: #fff4f5;

      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        linear-gradient(
          135deg,
          #f8fafc 0%,
          #f3f6fa 50%,
          #f8fafc 100%
        );

      color: var(--text);

      font-family:
        "Inter",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Very subtle grid — no glow */
    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: .35;

      background-image:
        linear-gradient(
          rgba(15, 23, 42, .025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(15, 23, 42, .025) 1px,
          transparent 1px
        );

      background-size: 44px 44px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 85%
        );

      -webkit-mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 85%
        );
    }

    main {
      position: relative;

      width: min(100%, 560px);

      padding: 44px 42px 30px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow:
        0 20px 55px rgba(15, 23, 42, .08),
        0 2px 8px rgba(15, 23, 42, .035);

      text-align: center;

      animation: cardIn .4s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Top accent */
    .top-line {
      position: absolute;

      top: 0;
      left: 34px;
      right: 34px;

      height: 2px;

      background: #2563eb;

      border-radius: 0 0 10px 10px;
    }

    /* Icon */
    .icon {
      width: 72px;
      height: 72px;

      margin: 0 auto 24px;

      display: grid;
      place-items: center;

      border-radius: 20px;

      background: var(--red-bg);

      border: 1px solid #ffd9dd;

      color: var(--red);

      font-family: "Space Grotesk", sans-serif;

      font-size: 30px;
      font-weight: 700;

      box-shadow: none;
    }

    .eyebrow {
      margin-bottom: 9px;

      color: #8a94a5;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      color: #111827;

      font-family: "Space Grotesk", sans-serif;

      font-size: clamp(28px, 5vw, 38px);

      line-height: 1.05;

      letter-spacing: -1.4px;

      font-weight: 700;
    }

    p {
      max-width: 450px;

      margin: 16px auto 0;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    /* Status */
    .status {
      min-height: 48px;

      margin-top: 27px;

      padding: 12px 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      background: #f8fafc;

      border: 1px solid var(--border);

      border-radius: 12px;

      color: #596579;

      font-family: "Space Grotesk", monospace;

      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 7px;
      height: 7px;

      flex: 0 0 7px;

      border-radius: 50%;

      background: var(--red);
    }

    /* Buttons */
    .actions {
      margin-top: 14px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    button {
      min-height: 50px;

      border-radius: 12px;

      padding: 12px 16px;

      font-family: "Inter", sans-serif;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }

    .reload-btn {
      border: 1px solid var(--blue);

      background: var(--blue);

      color: #fff;
    }

    .reload-btn:hover {
      background: var(--blue-hover);

      border-color: var(--blue-hover);

      transform: translateY(-1px);
    }

    .root-btn {
      border: 1px solid var(--border-dark);

      background: #fff;

      color: #344054;
    }

    .root-btn:hover {
      background: #f8fafc;

      border-color: #cbd2dc;

      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 2px solid #93b4ff;

      outline-offset: 3px;
    }

    .hint {
      margin-top: 13px;

      color: var(--muted-light);

      font-size: 11px;

      line-height: 1.5;
    }

    .footer {
      margin-top: 27px;

      padding-top: 18px;

      border-top: 1px solid #edf0f4;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      color: #9aa3b1;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: .7px;

      text-transform: uppercase;
    }

    .footer-mark {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #9aa3b1;
    }

    /* Tablet */
    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      main {
        padding: 38px 30px 28px;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      main {
        width: 100%;

        padding: 32px 20px 24px;

        border-radius: 18px;
      }

      .top-line {
        left: 22px;
        right: 22px;
      }

      .icon {
        width: 62px;
        height: 62px;

        margin-bottom: 21px;

        border-radius: 17px;

        font-size: 26px;
      }

      .eyebrow {
        font-size: 9px;

        letter-spacing: 1.7px;
      }

      h1 {
        font-size: 28px;

        letter-spacing: -1px;
      }

      p {
        margin-top: 14px;

        font-size: 13px;

        line-height: 1.65;
      }

      .status {
        margin-top: 22px;

        font-size: 11px;
      }

      .actions {
        grid-template-columns: 1fr;

        gap: 9px;
      }

      button {
        min-height: 48px;
      }

      .footer {
        margin-top: 24px;
      }
    }

    /* Small phones */
    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      main {
        padding: 28px 17px 21px;
      }

      h1 {
        font-size: 25px;
      }

      p {
        font-size: 12.5px;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }

      button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main>

    <div class="top-line"></div>

    <div class="icon">!</div>

    <div class="eyebrow">
      Security checkpoint
    </div>

    <h1>
      Access Restricted
    </h1>

    <p>
      Developer tools were detected on this page.
      Please close Inspect or DevTools and reload the page to continue.
    </p>

    <div class="status">
      <span class="dot"></span>
      Protected page
    </div>

    <div class="actions">

      <button
        class="root-btn"
        type="button"
        onclick="window.location.href='/'"
      >
        ↻ &nbsp; Reload Page
      </button>

    </div>

    <div class="hint">
      Close Developer Tools before continuing.
    </div>

    <div class="footer">
      <span class="footer-mark"></span>
      Security protection enabled
    </div>

  </main>

</body>
</html>
