<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoUS Response</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #eee;
      font-family: monospace;
    }

    h2 {
      color: #00ff88;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #1b1b1b;
      padding: 20px;
      border-radius: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>

  <h2>Full Response</h2>
  <pre id="output">Loading...</pre>

  <script>
    const endpoint = "https://geousv2.vercel.app/graphql";

    const query = `
      query {
        userInfo {
          ip
          requestTime
          requestId
          geo {
            ip
            city
            region
            regionCode
            country
            countryCode
            continent
            continentCode
            latitude
            longitude
            timezone
            postalCode
            isp
            org
            asn
            connectionType
            isProxy
            isVpn
            isHosting
            isEurope
            currency
            callingCode
            flag
          }
          device {
            browser
            browserVersion
            os
            osVersion
            deviceType
            deviceBrand
            deviceModel
            isMobile
            isTablet
            isDesktop
            isBot
            cpu
            renderingEngine
            userAgent
          }
          network {
            protocol
            referer
            origin
            acceptLanguage
            acceptEncoding
            dnt
            secFetchSite
            secFetchMode
            cfConnectingIp
            cfIpCountry
            xForwardedFor
          }
        }
      }
    `;

    async function loadData() {
      const output = document.getElementById("output");

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ query })
        });

        const data = await response.json();

        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = "Error: " + error.message;
      }
    }

    // Page open hote hi request
    loadData();
  </script>

</body>
</html>
