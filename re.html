<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>reCastales — Art Generator</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg: #0d0d0c;
    --panel: #151514;
    --panel2: #1b1b19;
    --line: #30302d;
    --text: #e9e7df;
    --muted: #8c8b84;
    --accent: #d9cdb7;
  }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% -20%, #25251f 0%, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
  }

  /* SIDEBAR */

  .sidebar {
    border-right: 1px solid var(--line);
    padding: 28px 22px;
    background: #111110;
    overflow-y: auto;
  }

  .brand {
    margin-bottom: 28px;
  }

  .brand-name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.8px;
  }

  .brand-sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .section {
    margin-top: 24px;
  }

  .section-title {
    color: #aaa89f;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  label {
    display: block;
    font-size: 11px;
    color: #aaa89f;
    margin-bottom: 7px;
  }

  input,
  select {
    width: 100%;
    height: 40px;
    background: #0c0c0b;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 0 11px;
    outline: none;
  }

  input:focus,
  select:focus {
    border-color: #5a584f;
  }

  .control {
    margin-bottom: 14px;
  }

  input[type="range"] {
    padding: 0;
    height: 4px;
    accent-color: #cfc5b1;
  }

  .range-value {
    float: right;
    color: #d7d3c9;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
  }

  button {
    border: 1px solid var(--line);
    background: #1a1a18;
    color: var(--text);
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: .15s ease;
  }

  button:hover {
    background: #242421;
    border-color: #55534c;
  }

  button.primary {
    background: #ded5c4;
    color: #11110f;
    border-color: #ded5c4;
  }

  button.primary:hover {
    background: #eee6d7;
  }

  .full {
    grid-column: 1 / -1;
  }

  .traits {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .trait {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #242421;
    font-size: 11px;
  }

  .trait span:first-child {
    color: var(--muted);
  }

  .trait span:last-child {
    color: #ddd8cc;
    text-align: right;
  }

  /* MAIN */

  main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    height: 72px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
  }

  .collection-title {
    font-size: 13px;
    color: #aaa89f;
  }

  .collection-title strong {
    color: #eeeae0;
  }

  .status {
    font-size: 11px;
    color: #797870;
  }

  .stage {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }

  .art-frame {
    width: min(76vh, 760px);
    height: min(76vh, 760px);
    max-width: 100%;
    max-height: calc(100vh - 150px);
    position: relative;
    background: #080807;
    border: 1px solid #34332f;
    padding: 12px;
    box-shadow: 0 18px 60px rgba(0,0,0,.38);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #111;
  }

  .watermark {
    position: absolute;
    bottom: 25px;
    left: 25px;
    font-size: 9px;
    letter-spacing: .18em;
    color: rgba(255,255,255,.45);
    text-transform: uppercase;
    pointer-events: none;
  }

  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
    }

    .sidebar {
      border-right: none;
      border-bottom: 1px solid var(--line);
    }

    .stage {
      padding: 20px;
    }

    .art-frame {
      width: min(92vw, 760px);
      height: min(92vw, 760px);
    }
  }
</style>
</head>

<body>

<div class="app">

      </div>

        <select id="worldType">
          <option value="random">Random</option>
          <option value="ruins">Forgotten Ruins</option>
          <option value="city">Impossible City</option>
          <option value="monolith">Monolith</option>
          <option value="temple">Lost Temple</option>
          <option value="desert">Dead Landscape</option>
          <option value="creature">Synthetic Creature</option>
          <option value="archive">The Archive</option>
        </select>

    <div class="section">
      <div class="section-title">Aesthetic</div>

      <div class="control">
        <label>Palette</label>
        <select id="palette">
          <option value="bone">Bone / Charcoal</option>
          <option value="sand">Sand / Ink</option>
          <option value="oxide">Oxide / Stone</option>

      <div class="control">

        <input id="surreal" type="range" min="0" max="100" value="65">
      </div>

      <div class="control">
        <label>Detail <span class="range-value" id="detailValue">55</span></label>
        <input id="detail" type="range" min="0" max="100" value="55">
      </div>

      <div class="control">
        <label>Grain <span class="range-value" id="grainValue">25</span></label>
        <input id="grain" type="range" min="0" max="100" value="25">
      </div>
    </div>

    <div class="buttons">
      <button class="primary full" id="generate">Generate World</button>
      <button id="previous">← Previous</button>
      <button id="next">Next →</button>
      <button class="full" id="randomize">Random World</button>
      <button class="full" id="download">Download PNG</button>
    </div>

    <div class="traits">
      <div class="section-title">Traits</div>

      <div class="trait">
        <span>World</span>
        <span id="traitWorld">—</span>
      </div>

      <div class="trait">
        <span>Palette</span>
        <span id="traitPalette">—</span>
      </div>

      <div class="trait">
        <span>Structure</span>
        <span id="traitStructure">—</span>
      </div>

      <div class="trait">
        <span>Atmosphere</span>
        <span id="traitAtmosphere">—</span>
      </div>

      <div class="trait">
        <span>Seed</span>
        <span id="traitSeed">—</span>
      </div>
    </div>

  </aside>

  <main>

    <div class="topbar">
      <div class="collection-title">
        <strong>reCastales</strong> / 1,888 fragments
      </div>

      <div class="status" id="status">
        READY
      </div>
    </div>

    <div class="stage">

      <div class="art-frame">
        <canvas id="canvas" width="1024" height="1024"></canvas>
        <div class="watermark">reCastales / 1888</div>
      </div>

    </div>

  </main>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* -----------------------------
   SEEDED RANDOM
----------------------------- */

function hashString(str) {
  let h = 2166136261;

  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }

  return h >>> 0;
}

function RNG(seed) {
  let state = hashString(seed);

  return function() {
    state += 0x6D2B79F5;

    let t = state;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function pick(rng, arr) {
  return arr[Math.floor(rng() * arr.length)];
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

/* -----------------------------
   PALETTES
----------------------------- */

const palettes = {

  bone: {
    name: "Bone / Charcoal",
    bg: "#d8d0c1",
    dark: "#181816",
    mid: "#59564d",
    light: "#eee8dc",
    accent: "#8b7660",
    red: "#76564a"
  },

  sand: {
    name: "Sand / Ink",
    bg: "#cbb99a",
    dark: "#171513",
    mid: "#665946",
    light: "#eee1c6",
    accent: "#96724d",
    red: "#70453d"
  },

  oxide: {
    name: "Oxide / Stone",
    bg: "#8f8980",
    dark: "#171717",
    mid: "#45433e",
    light: "#c8c1b6",
    accent: "#8c4e3e",
    red: "#69352d"
  },

  forest: {
    name: "Forest / Bone",
    bg: "#687061",
    dark: "#111411",
    mid: "#353c33",
    light: "#d5d0bf",
    accent: "#8d9270",
    red: "#714e43"
  },

  night: {
    name: "Night / Dust",
    bg: "#25292a",
    dark: "#090a0a",
    mid: "#50504b",
    light: "#d0c8b8",
    accent: "#8d806c",
    red: "#764a40"
  },

  clay: {
    name: "Clay / Cream",
    bg: "#b4775f",
    dark: "#1b1513",
    mid: "#68453a",
    light: "#ead9c2",
    accent: "#a89472",
    red: "#542d28"
  }
};

/* -----------------------------
   GEOMETRY
----------------------------- */

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function polygon(points, color) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);

  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i][0], points[i][1]);
  }

  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function line(x1, y1, x2, y2, color, width=2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function circle(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

/* -----------------------------
   BACKGROUND
----------------------------- */

function drawBackground(p, rng) {

  rect(0, 0, W, H, p.bg);

  /*
    Flat tonal blocks.
    No glow, no neon gradients.
  */

  const blocks = 8 + Math.floor(rng() * 12);

  for (let i = 0; i < blocks; i++) {

    const x = rng() * W;
    const y = rng() * H;
    const w = 80 + rng() * 400;
    const h = 40 + rng() * 260;

    ctx.globalAlpha = .05 + rng() * .08;

    rect(
      x,
      y,
      w,
      h,
      rng() > .5 ? p.dark : p.light
    );

    ctx.globalAlpha = 1;
  }
}

/* -----------------------------
   SUN / MOON
----------------------------- */

function drawCelestial(p, rng) {

  const x = 150 + rng() * 724;
  const y = 100 + rng() * 330;
  const r = 40 + rng() * 100;

  circle(x, y, r, p.light);

  ctx.globalAlpha = .35;
  circle(x + r * .2, y - r * .15, r * .8, p.bg);
  ctx.globalAlpha = 1;
}

/* -----------------------------
   ARCHITECTURE
----------------------------- */

function building(p, rng, x, ground, width, height) {

  const dark = p.dark;
  const mid = p.mid;

  rect(
    x,
    ground - height,
    width,
    height,
    rng() > .35 ? dark : mid
  );

  const floors = Math.max(2, Math.floor(height / 55));

  for (let f = 0; f < floors; f++) {

    const fy = ground - height + 22 + f * 48;

    const windows = Math.max(
      1,
      Math.floor(width / 45)
    );

    for (let w = 0; w < windows; w++) {

      if (rng() > .28) {

        const wx =
          x + 12 + w * (width - 24) / windows;

        rect(
          wx,
          fy,
          8 + rng() * 12,
          18 + rng() * 12,
          rng() > .5 ? p.bg : p.accent
        );
      }
    }
  }

  if (rng() > .5) {

    rect(
      x + width * .2,
      ground - height - 25,
      width * .6,
      25,
      dark
    );
  }
}

function drawCity(p, rng, architecture) {

  const horizon = 680;

  const count = 8 + Math.floor(architecture / 8);

  for (let i = 0; i < count; i++) {

    const x = -30 + i * (W / count);

    const width = 70 + rng() * 150;

    const height =
      120 +
      rng() * (220 + architecture * 3);

    building(
      p,
      rng,
      x,
      horizon,
      width,
      height
    );
  }

  /* impossible tower */

  if (rng() > .35) {

    const x = 410 + rng() * 180;
    const w = 100 + rng() * 100;
    const h = 300 + rng() * 180;

    polygon([
      [x, horizon],
      [x + w, horizon],
      [x + w * .72, horizon - h],
      [x + w * .25, horizon - h * .8]
    ], p.dark);

    for (let i = 0; i < 7; i++) {

      const yy = horizon - 45 - i * 55;

      line(
        x + 20,
        yy,
        x + w - 20,
        yy - 15,
        p.accent,
        4
      );
    }
  }
}

/* -----------------------------
   RUINS
----------------------------- */

function drawRuins(p, rng, detail) {

  const ground = 760;

  const columns =
    3 + Math.floor(detail / 14);

  for (let i = 0; i < columns; i++) {

    const x =
      100 +
      i * (760 / columns) +
      rng() * 50;

    const h =
      180 +
      rng() * 260;

    const w =
      50 +
      rng() * 65;

    rect(
      x,
      ground - h,
      w,
      h,
      p.dark
    );

    /* broken top */

    polygon([
      [x, ground - h],
      [x + w * .35, ground - h - rng() * 50],
      [x + w * .7, ground - h + 5],
      [x + w, ground - h - rng() * 30],
      [x + w, ground - h + 30],
      [x, ground - h + 25]
    ], p.dark);

    /* carved marks */

    for (let k = 0; k < 5; k++) {

      line(
        x + 10 + rng() * (w - 20),
        ground - h + 40 + k * 35,
        x + 20 + rng() * (w - 30),
        ground - h + 65 + k * 35,
        p.mid,
        3
      );
    }
  }

  /* arch */

  const ax = 350 + rng() * 220;
  const ay = 390;
  const aw = 280;
  const ah = 360;

  rect(ax, ay, aw, ah, p.dark);

  ctx.globalCompositeOperation = "destination-out";

  ctx.beginPath();
  ctx.arc(
    ax + aw / 2,
    ay + 180,
    90,
    Math.PI,
    0
  );
  ctx.rect(
    ax + aw / 2 - 90,
    ay + 180,
    180,
    180
  );
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";
}

/* -----------------------------
   MONOLITH
----------------------------- */

function drawMonolith(p, rng, surreal) {

  const cx = 512;
  const base = 790;

  const width =
    150 + rng() * (160 + surreal);

  const height =
    350 + rng() * 330;

  polygon([
    [cx - width / 2, base],
    [cx - width * .38, base - height],
    [cx + width * .28, base - height - rng() * 70],
    [cx + width / 2, base],
  ], p.dark);

  /* cut-outs */

  const cuts = 2 + Math.floor(surreal / 20);

  for (let i = 0; i < cuts; i++) {

    const y =
      base -
      80 -
      rng() * (height - 100);

    const w =
      20 +
      rng() * 70;

    rect(
      cx - w / 2 + rng() * 30,
      y,
      w,
      25 + rng() * 50,
      p.bg
    );
  }

  /* floating fragments */

  const fragments =
    2 + Math.floor(surreal / 15);

  for (let i = 0; i < fragments; i++) {

    const x =
      cx - 280 + rng() * 560;

    const y =
      180 + rng() * 480;

    const s =
      15 + rng() * 60;

    polygon([
      [x, y],
      [x + s, y - s * .3],
      [x + s * .7, y + s],
      [x - s * .2, y + s * .6]
    ], p.mid);
  }
}

/* -----------------------------
   TEMPLE
----------------------------- */

function drawTemple(p, rng, detail) {

  const base = 770;

  const steps = 7 + Math.floor(detail / 12);

  for (let i = 0; i < steps; i++) {

    const inset = i * 42;

    rect(
      170 + inset,
      base - i * 38,
      684 - inset * 2,
      38,
      i % 2 === 0 ? p.dark : p.mid
    );
  }

  const top = 300;

  rect(
    335,
    top,
    354,
    310,
    p.dark
  );

  const pillars = 5;

  for (let i = 0; i < pillars; i++) {

    rect(
      360 + i * 68,
      top + 40,
      32,
      270,
      p.light
    );
  }

  /* central doorway */

  ctx.fillStyle = p.bg;

  ctx.beginPath();
  ctx.arc(
    512,
    top + 205,
    72,
    Math.PI,
    0
  );

  ctx.rect(
    440,
    top + 205,
    144,
    105
  );

  ctx.fill();
}

/* -----------------------------
   DESERT
----------------------------- */

function drawDesert(p, rng, surreal) {

  const horizon = 610;

  polygon([
    [0, horizon],
    [W, horizon],
    [W, H],
    [0, H]
  ], p.mid);

  /* dunes */

  for (let i = 0; i < 8; i++) {

    const y =
      horizon +
      i * 55;

    ctx.beginPath();

    ctx.moveTo(0, y);

    for (let x = 0; x <= W; x += 80) {

      const yy =
        y +
        Math.sin(x / 100 + i) * (15 + surreal / 8);

      ctx.lineTo(x, yy);
    }

    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();

    ctx.globalAlpha = .15 + i * .025;

    ctx.fillStyle =
      i % 2 === 0 ? p.dark : p.light;

    ctx.fill();

    ctx.globalAlpha = 1;
  }

  /* impossible object */

  if (rng() > .25) {

    const x = 260 + rng() * 500;
    const y = 380 + rng() * 120;
    const s = 100 + rng() * 160;

    polygon([
      [x, y],
      [x + s, y - 40],
      [x + s * 1.2, y + s],
      [x + s * .2, y + s * .7]
    ], p.dark);

    circle(
      x + s * .55,
      y + s * .4,
      25 + rng() * 35,
      p.bg
    );
  }
}

/* -----------------------------
   CREATURE
----------------------------- */

function drawCreature(p, rng, surreal) {

  const cx = 512;
  const cy = 580;

  const scale =
    180 + rng() * 100;

  /* body */

  ctx.fillStyle = p.dark;

  ctx.beginPath();

  ctx.ellipse(
    cx,
    cy,
    scale * .8,
    scale * 1.2,
    rng() * .2 - .1,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* head */

  polygon([
    [cx - 100, cy - 100],
    [cx - 65, cy - 260],
    [cx + 30, cy - 300],
    [cx + 120, cy - 210],
    [cx + 100, cy - 80]
  ], p.dark);

  /* horns */

  polygon([
    [cx - 55, cy - 240],
    [cx - 180, cy - 350],
    [cx - 100, cy - 180]
  ], p.dark);

  polygon([
    [cx + 65, cy - 240],
    [cx + 180, cy - 350],
    [cx + 100, cy - 180]
  ], p.dark);

  /* face */

  circle(
    cx - 42,
    cy - 195,
    16,
    p.light
  );

  circle(
    cx + 42,
    cy - 195,
    16,
    p.light
  );

  /* markings */

  for (let i = 0; i < 7 + surreal / 20; i++) {

    line(
      cx - 70 + rng() * 140,
      cy - 100 + rng() * 190,
      cx - 60 + rng() * 120,
      cy - 70 + rng() * 180,
      p.accent,
      5
    );
  }

  /* orbiting fragments */

  for (let i = 0; i < 5; i++) {

    const angle = rng() * Math.PI * 2;
    const radius = 300 + rng() * 120;

    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;

    rect(
      x,
      y,
      25 + rng() * 40,
      25 + rng() * 40,
      p.mid
    );
  }
}

/* -----------------------------
   ARCHIVE
----------------------------- */

function drawArchive(p, rng, detail) {

  const rows = 5 + Math.floor(detail / 12);
  const cols = 5 + Math.floor(detail / 12);

  const cellW = 115;
  const cellH = 115;

  const startX = 65;
  const startY = 70;

  for (let y = 0; y < rows; y++) {

    for (let x = 0; x < cols; x++) {

      const xx = startX + x * cellW;
      const yy = startY + y * cellH;

      rect(
        xx,
        yy,
        cellW - 8,
        cellH - 8,
        rng() > .5 ? p.dark : p.light
      );

      if (rng() > .25) {

        circle(
          xx + 55,
          yy + 52,
          18 + rng() * 25,
          rng() > .5 ? p.mid : p.accent
        );
      }
    }
  }

  /* central archive */

  rect(
    310,
    300,
    404,
    420,
    p.dark
  );

  rect(
    350,
    340,
    324,
    340,
    p.bg
  );

  for (let i = 0; i < 8; i++) {

    line(
      380,
      380 + i * 34,
      640,
      380 + i * 34,
      p.mid,
      5
    );
  }
}

/* -----------------------------
   GROUND
----------------------------- */

function drawGround(p, rng) {

  polygon([
    [0, 760],
    [250, 720],
    [500, 755],
    [760, 710],
    [1024, 750],
    [1024, 1024],
    [0, 1024]
  ], p.dark);

  /* terrain cuts */

  for (let i = 0; i < 18; i++) {

    const x = rng() * W;
    const y = 760 + rng() * 230;

    line(
      x,
      y,
      x + 30 + rng() * 80,
      y - 5 + rng() * 20,
      p.mid,
      3
    );
  }
}

/* -----------------------------
   GRAIN
----------------------------- */

function addGrain(amount, rng) {

  if (amount <= 0) return;

  const count =
    Math.floor(amount * 1800);

  ctx.globalAlpha =
    .025 + amount / 1000;

  for (let i = 0; i < count; i++) {

    const x = rng() * W;
    const y = rng() * H;

    const s =
      rng() > .8 ? 2 : 1;

    ctx.fillStyle =
      rng() > .5
        ? "#000000"
        : "#ffffff";

    ctx.fillRect(x, y, s, s);
  }

  ctx.globalAlpha = 1;
}

/* -----------------------------
   FRAME
----------------------------- */

function drawFrame(p) {

  ctx.strokeStyle = p.dark;
  ctx.lineWidth = 8;

  ctx.strokeRect(
    28,
    28,
    W - 56,
    H - 56
  );

  ctx.strokeStyle = p.mid;
  ctx.lineWidth = 2;

  ctx.strokeRect(
    48,
    48,
    W - 96,
    H - 96
  );
}

/* -----------------------------
   MAIN GENERATOR
----------------------------- */

function generate() {

  const token =
    Number(document.getElementById("tokenId").value);

  const seed =
    document.getElementById("seed").value ||
    `RECASTALES-${token}`;

  const rng = RNG(seed);

  let paletteName =
    document.getElementById("palette").value;

  if (paletteName === "random") {

    paletteName =
      pick(rng, Object.keys(palettes));
  }

  const p = palettes[paletteName];

  let type =
    document.getElementById("worldType").value;

  if (type === "random") {

    type = pick(rng, [
      "ruins",
      "city",
      "monolith",
      "temple",
      "desert",
      "creature",
      "archive"
    ]);
  }

  const architecture =
    Number(document.getElementById("architecture").value);

  const surreal =
    Number(document.getElementById("surreal").value);

  const detail =
    Number(document.getElementById("detail").value);

  const grain =
    Number(document.getElementById("grain").value);

  ctx.clearRect(0, 0, W, H);

  drawBackground(p, rng);

  drawCelestial(p, rng);

  switch (type) {

    case "ruins":
      drawRuins(p, rng, detail);
      break;

    case "city":
      drawCity(p, rng, architecture);
      break;

    case "monolith":
      drawMonolith(p, rng, surreal);
      break;

    case "temple":
      drawTemple(p, rng, detail);
      break;

    case "desert":
      drawDesert(p, rng, surreal);
      break;

    case "creature":
      drawCreature(p, rng, surreal);
      break;

    case "archive":
      drawArchive(p, rng, detail);
      break;
  }

  drawGround(p, rng);

  addGrain(grain, rng);

  drawFrame(p);

  updateTraits(
    token,
    seed,
    type,
    p,
    rng
  );

  document.getElementById("status").textContent =
    `WORLD ${String(token).padStart(4,"0")} / GENERATED`;
}

/* -----------------------------
   TRAITS
----------------------------- */

function updateTraits(token, seed, type, p, rng) {

  const worldNames = {
    ruins: "Forgotten Ruins",
    city: "Impossible City",
    monolith: "The Monolith",
    temple: "Lost Temple",
    desert: "Dead Landscape",
    creature: "Synthetic Creature",
    archive: "The Archive"
  };

  const structures = [
    "Collapsed",
    "Monolithic",
    "Geometric",
    "Vertical",
    "Buried",
    "Fragmented",
    "Unknown"
  ];

  const atmospheres = [
    "Silent",
    "Ancient",
    "Uninhabited",
    "Dreamlike",
    "Post-Human",
    "Forgotten",
    "Unstable"
  ];

  document.getElementById("traitWorld").textContent =
    worldNames[type] || type;

  document.getElementById("traitPalette").textContent =
    p.name;

  document.getElementById("traitStructure").textContent =
    pick(rng, structures);

  document.getElementById("traitAtmosphere").textContent =
    pick(rng, atmospheres);

  document.getElementById("traitSeed").textContent =
    seed;
}

/* -----------------------------
   CONTROLS
----------------------------- */

document
  .getElementById("generate")
  .onclick = generate;

document
  .getElementById("randomize")
  .onclick = () => {

    const token =
      Math.floor(Math.random() * 1888) + 1;

    document.getElementById("tokenId").value =
      token;

    document.getElementById("seed").value =
      `RECASTALES-${String(token).padStart(4,"0")}-${Math.random().toString(36).substring(2,7).toUpperCase()}`;

    document.getElementById("worldType").value =
      "random";

    document.getElementById("palette").value =
      "random";

    document.getElementById("architecture").value =
      35 + Math.floor(Math.random() * 60);

    document.getElementById("surreal").value =
      35 + Math.floor(Math.random() * 65);

    document.getElementById("detail").value =
      35 + Math.floor(Math.random() * 65);

    document.getElementById("grain").value =
      10 + Math.floor(Math.random() * 40);

    updateRangeLabels();

    generate();
  };

document
  .getElementById("previous")
  .onclick = () => {

    const input =
      document.getElementById("tokenId");

    input.value =
      Math.max(1, Number(input.value) - 1);

    document.getElementById("seed").value =
      `RECASTALES-${String(input.value).padStart(4,"0")}`;

    generate();
  };

document
  .getElementById("next")
  .onclick = () => {

    const input =
      document.getElementById("tokenId");

    input.value =
      Math.min(1888, Number(input.value) + 1);

    document.getElementById("seed").value =
      `RECASTALES-${String(input.value).padStart(4,"0")}`;

    generate();
  };

document
  .getElementById("download")
  .onclick = () => {

    const id =
      String(
        document.getElementById("tokenId").value
      ).padStart(4, "0");

    const link =
      document.createElement("a");

    link.download =
      `reCastales-${id}.png`;

    link.href =
      canvas.toDataURL("image/png");

    link.click();
  };

/* -----------------------------
   RANGE LABELS
----------------------------- */

function updateRangeLabels() {

  const ids = [
    ["architecture", "architectureValue"],
    ["surreal", "surrealValue"],
    ["detail", "detailValue"],
    ["grain", "grainValue"]
  ];

  ids.forEach(([input, output]) => {

    document.getElementById(output).textContent =
      document.getElementById(input).value;
  });
}

[
  "architecture",
  "surreal",
  "detail",
  "grain"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      updateRangeLabels
    );
});

/* -----------------------------
   AUTO SEED BY TOKEN
----------------------------- */

document
  .getElementById("tokenId")
  .addEventListener("change", e => {

    const id =
      String(
        clamp(Number(e.target.value), 1, 1888)
      ).padStart(4, "0");

    e.target.value =
      Number(id);

    document.getElementById("seed").value =
      `RECASTALES-${id}`;

    generate();
  });

/* INITIAL */

updateRangeLabels();
generate();

</script>
