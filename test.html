<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Check</title>
</head>
<body>

<h2 id="message">Checking...</h2>

<script>
const CHANNEL_NAME = "exyz";
const channel = new BroadcastChannel(CHANNEL_NAME);

let alreadyOpen = false;

channel.postMessage({ type: "CHECK" });
channel.onmessage = function (event) {
    if (event.data.type === "CHECK") {
        channel.postMessage({ type: "ALREADY_OPEN" });
    }

    if (event.data.type === "ALREADY_OPEN") {
        alreadyOpen = true;
        document.getElementById("message").textContent = "Already opened in another tab.";
    }
};

setTimeout(() => {
    if (!alreadyOpen) {
        document.getElementById("message").textContent = "Hey;";
    }
}, 500);
</script>

</body>
</html>
