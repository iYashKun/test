<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ASCII Shader</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
    }

    #ascii-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
    }

    #ascii-output {
        font-family: monospace;
        line-height: 1;
        letter-spacing: 0px;
        white-space: pre;
        margin: 0;
        padding: 0;
        cursor: pointer;
        user-select: none;
    }
</style>
</head>
<body>

<div id="ascii-container">
    <pre id="ascii-output">Generating Color ASCII...</pre>
</div>

<canvas id="art" style="display:none;"></canvas>

<script>
const canvas = document.getElementById("art");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const asciiOutput = document.getElementById("ascii-output");
const asciiWidth = 160; 
const charAspectRatio = 0.5;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function drawGlowCircle(x, y, r, color) {
    ctx.save();
    ctx.globalAlpha = 0.35;

    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, "transparent");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawSquare(x, y, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
    ctx.restore();
}

function drawLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
}

function generate() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const palette = [
        "#ff003c",
        "#ff006e",
        "#d000ff",
        "#8b00ff"
    ];

    for (let i = 0; i < 8; i++) {
        drawGlowCircle(rand(0, canvas.width), rand(0, canvas.height), rand(80, 250), palette[Math.floor(Math.random() * palette.length)]);
    }

    for (let i = 0; i < 20; i++) {
        drawSquare(rand(0, canvas.width), rand(0, canvas.height), rand(20, 100), palette[Math.floor(Math.random() * palette.length)]);
    }

    for (let i = 0; i < 25; i++) {
        drawLine(rand(0, canvas.width), 0, rand(0, canvas.width), canvas.height, palette[Math.floor(Math.random() * palette.length)]);
    }

    for (let i = 0; i < 25; i++) {
        drawLine(0, rand(0, canvas.height), canvas.width, rand(0, canvas.height), palette[Math.floor(Math.random() * palette.length)]);
    }

    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.font = "24px monospace";
    ctx.fillText("FRAGNITES", 40, 60);
    ctx.fillText("#" + Math.floor(rand(1, 4444)), 40, 95);
    ctx.restore();

    renderColorAscii();
}

function renderColorAscii() {
    const asciiHeight = Math.round(asciiWidth * (canvas.height / canvas.width) * charAspectRatio);
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = asciiWidth;
    tempCanvas.height = asciiHeight;

    tempCtx.drawImage(canvas, 0, 0, asciiWidth, asciiHeight);

    const imageData = tempCtx.getImageData(0, 0, asciiWidth, asciiHeight);
    const data = imageData.data;
    
    let htmlOutput = "";
    for (let y = 0; y < asciiHeight; y++) {
        let currentColor = "";
        let batchText = "";
        for (let x = 0; x < asciiWidth; x++) {
            const idx = (y * asciiWidth + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const brightness = 0.2126 * r + 0.7152 * g + 0.0722 * b;

            if (brightness > 15) {
                const hexColor = `rgb(${r},${g},${b})`;
                if (hexColor === currentColor) {
                    batchText += "█";
                } else {
                    if (batchText !== "") {
                        htmlOutput += `<span style="color:${currentColor}">${batchText}</span>`;
                    }
                    currentColor = hexColor;
                    batchText = "█";
                }
            } else {
                if (batchText !== "") {
                    htmlOutput += `<span style="color:${currentColor}">${batchText}</span>`;
                    batchText = "";
                    currentColor = "";
                }
                htmlOutput += " ";
            }
        }
        if (batchText !== "") {
            htmlOutput += `<span style="color:${currentColor}">${batchText}</span>`;
        }
        htmlOutput += "\n";
    }

    asciiOutput.innerHTML = htmlOutput;
    const fontSize = window.innerWidth / asciiWidth;
    asciiOutput.style.fontSize = fontSize + 'px';
}

resize();
generate();

window.addEventListener("resize", () => {
    resize();
    generate();
});

document.getElementById("ascii-container").addEventListener("click", generate);

</script>
</body>
</html>
