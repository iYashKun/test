<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #080808;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Yellow Grid Background */
    .yellow-grid-bg {
      background-color: #ffd900;
      background-image:
        linear-gradient(rgba(8, 8, 8, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(8, 8, 8, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 20s linear infinite;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    @keyframes gridDrift {
      to {
        background-position: 48px 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .yellow-grid-bg {
        animation: none;
      }
    }

    /* Content Box */
    .welcome-box {
      text-align: center;
      max-width: 700px;
      width: 100%;
    }

    .welcome-box h1 {
      font-size: clamp(42px, 10vw, 80px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .welcome-box p {
      font-size: clamp(16px, 3vw, 22px);
      line-height: 1.5;
      margin-bottom: 35px;
      opacity: 0.85;
    }

    .btn {
      display: inline-block;
      background: #080808;
      color: #ffd900;
      padding: 16px 40px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border: 2px solid #080808;
      transition: 0.25s;
    }

    .btn:hover {
      background: transparent;
      color: #080808;
      transform: translateY(-3px);
    }

    /* Footer */
    footer {
      background: #080808;
      color: #ffd900;
      text-align: center;
      padding: 18px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
      .welcome-box h1 {
        margin-bottom: 15px;
      }

      .btn {
        padding: 14px 32px;
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>

  <section class="yellow-grid-bg">
    <div class="welcome-box">
      <h1>Welcome</h1>
      <p>A clean and simple welcome page with the yellow grid background.</p>
      <a href="#" class="btn">Get Started</a>
    </div>
  </section>

  <footer>
    © 2026 You
  </footer>

</body>
</html>
